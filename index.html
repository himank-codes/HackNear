<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HackNear – hackathons near you</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #EBE2CC;
            --taupe: #B7B09E;
            --navy: #2f2f2d;
            --bg: #B7B09E;
            --card: #EBE2CC;
            --ink: #2f2f2d;
            --mute: #3f3f3c;
            --line: #8c8672;
            --pri: #2f2f2d;
            --onpri: #EBE2CC;
            --chip: color-mix(in srgb, #B7B09E 35%, #EBE2CC);
            --ok: #1d6b3c;
            --warn: #8a3b1c;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #232322;
                --card: #323230;
                --ink: #EBE2CC;
                --mute: #B7B09E;
                --line: #55534c;
                --pri: #EBE2CC;
                --onpri: #2f2f2d;
                --chip: #44433f;
                --ok: #7fd9a2;
                --warn: #f0a98a
            }
        }

        :root[data-theme="dark"] {
            --bg: #232322;
            --card: #323230;
            --ink: #EBE2CC;
            --mute: #B7B09E;
            --line: #55534c;
            --pri: #EBE2CC;
            --onpri: #2f2f2d;
            --chip: #44433f;
            --ok: #7fd9a2;
            --warn: #f0a98a
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.5 Inter, system-ui, sans-serif
        }

        h1,
        h2,
        h3,
        p {
            margin: 0
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        :focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px
        }

        svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none;
            vertical-align: -4px
        }

        .top {
            background: var(--card);
            color: var(--ink);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 10
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            background: var(--card);
            z-index: 11
        }

        .tin {
            max-width: 1180px;
            margin: 0 auto;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 16px
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -.02em;
            cursor: pointer;
            white-space: nowrap
        }

        .srch {
            flex: 1;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--chip);
            color: var(--ink);
            border-radius: 50px;
            padding: 6px 14px
        }

        .srch input {
            border: 0;
            background: none;
            outline: 0;
            width: 100%;
            color: var(--ink)
        }

        .links {
            display: flex;
            gap: 2px;
            margin-left: auto
        }

        .links a {
            color: var(--ink);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap
        }

        .links a.on {
            background: var(--chip)
        }

        .av {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--card);
            display: grid;
            place-items: center;
            font-weight: 700;
            cursor: pointer;
            flex: none
        }

        .tg {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--chip);
            color: var(--ink);
            cursor: pointer;
            display: grid;
            place-items: center;
            flex: none
        }

        @media(max-width:820px) {
            .tin {
                flex-wrap: wrap;
                gap: 8px
            }

            .srch {
                order: 3;
                max-width: none;
                flex-basis: 100%
            }

            .links {
                order: 4;
                flex-basis: 100%;
                overflow-x: auto;
                margin: 0
            }

            .links a span {
                display: none
            }

            .tg {
                margin-left: auto
            }
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 16px 16px 48px
        }

        .crumb {
            color: var(--mute);
            margin-bottom: 12px
        }

        .lay {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 16px;
            align-items: start
        }

        @media(max-width:820px) {
            .lay {
                grid-template-columns: 1fr
            }

            .side {
                display: none
            }

            .side.show {
                display: block
            }
        }

        @media(min-width:821px) {
            .fbtn {
                display: none
            }
        }

        .box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px
        }

        .side h3 {
            font-size: 16px;
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            align-items: center
        }

        .fg {
            margin: 14px 0 0;
            padding-top: 12px;
            border-top: 1px solid var(--line)
        }

        .fg b {
            display: block;
            margin-bottom: 6px
        }

        .fg label {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 3px 0;
            cursor: pointer
        }

        .fg input {
            accent-color: var(--ink)
        }

        .fg select {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px
        }

        .fbtn {
            margin-bottom: 12px
        }

        .btn {
            background: var(--pri);
            color: var(--onpri);
            border: 1px solid var(--pri);
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            justify-content: center
        }

        .btn.o {
            background: transparent;
            color: var(--ink);
            border-color: var(--ink)
        }

        .btn.sm {
            padding: 4px 12px;
            font-size: 13px
        }

        .btn:disabled {
            opacity: .6;
            cursor: default
        }

        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px
        }

        .hd h2 {
            font-size: 20px
        }

        .hc {
            display: flex;
            gap: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer
        }

        .hc:hover {
            border-color: var(--ink)
        }

        .ban {
            width: 150px;
            min-height: 110px;
            border-radius: 8px;
            background: var(--chip);
            color: var(--ink);
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
            flex: none
        }

        .ban b {
            font-size: 26px;
            letter-spacing: -.02em
        }

        .ban small {
            opacity: .8;
            font-size: 11px
        }

        .mid {
            flex: 1;
            min-width: 0
        }

        .mid h3 {
            font-size: 16px
        }

        .mid .org {
            color: var(--mute);
            margin-bottom: 6px
        }

        .chip {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            background: var(--chip);
            border-radius: 50px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 500;
            margin: 0 6px 6px 0
        }

        .chip svg {
            width: 13px;
            height: 13px
        }

        .chip.g {
            color: var(--ok)
        }

        .rt {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
            flex: none
        }

        .ic {
            display: flex;
            gap: 6px
        }

        .ib {
            border: 0;
            background: none;
            padding: 4px;
            border-radius: 50%;
            cursor: pointer;
            display: grid;
            place-items: center
        }

        .ib:hover {
            background: var(--chip)
        }

        .ib.on svg {
            fill: var(--ink)
        }

        .left {
            font-size: 12px;
            color: var(--warn);
            font-weight: 600;
            display: flex;
            gap: 4px;
            align-items: center
        }

        .reg {
            font-size: 12px;
            color: var(--mute);
            display: flex;
            gap: 4px;
            align-items: center
        }

        @media(max-width:560px) {
            .hc {
                flex-wrap: wrap
            }

            .ban {
                width: 100%;
                min-height: 70px
            }

            .rt {
                flex-direction: row;
                width: 100%;
                align-items: center
            }
        }

        .dl {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 8px 12px
        }

        .dl dt {
            color: var(--mute);
            display: flex;
            gap: 6px;
            align-items: center
        }

        .dl dd {
            margin: 0
        }

        @media(max-width:560px) {
            .dl {
                grid-template-columns: 1fr
            }
        }

        .dg {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 16px;
            align-items: start
        }

        @media(max-width:820px) {
            .dg {
                grid-template-columns: 1fr
            }
        }

        .stick {
            position: sticky;
            top: calc(70px + env(safe-area-inset-top, 0px))
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--line);
            margin: 16px 0;
            overflow-x: auto
        }

        .tabs button {
            border: 0;
            background: none;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 600;
            color: var(--mute);
            border-bottom: 3px solid transparent;
            white-space: nowrap
        }

        .tabs button.on {
            color: var(--ink);
            border-color: var(--ink)
        }

        .big {
            font-size: 22px;
            font-weight: 700;
            margin: 4px 0 10px
        }

        .f {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px
        }

        .f input,
        .f select {
            flex: 1 1 140px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            min-width: 0
        }

        .two {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 12px
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
            border-top: 1px solid var(--line)
        }

        .row:first-of-type {
            border-top: 0
        }

        .mt {
            color: var(--mute)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 10px 6px;
            border-top: 1px solid var(--line)
        }

        th {
            color: var(--mute);
            border-top: 0
        }

        tr.me td {
            background: var(--chip);
            font-weight: 700
        }

        .chk label {
            display: flex;
            gap: 8px;
            padding: 3px 0
        }

        .chk input {
            accent-color: var(--ink)
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--card);
            padding: 10px 18px;
            border-radius: 8px;
            z-index: 20
        }

        .note {
            font-size: 12px;
            color: var(--mute);
            margin-top: 24px
        }
    </style>
</head>

<body>
    <div class="top">
        <div class="tin">
            <div class="logo" id="logo">HackNear</div>
            <div class="srch"><svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" />
                    <path d="M21 21l-4.35-4.35" />
                </svg><input id="q" placeholder="Search hackathons, cities, organisers" aria-label="Search"></div>
            <nav class="links" id="nav"></nav><button class="tg" id="tg" type="button"></button>
            <div class="av" id="av" title="My profile" role="button" tabindex="0">Y</div>
        </div>
    </div>
    <div class="wrap">
        <main id="main"></main>
        <p class="note">Sample data: events and players are made-up examples. Friends, teams and registrations are saved
            only in this browser. Real cross-user features need a backend.</p>
    </div>
    <script>
        const P = { search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>', bm: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>', sh: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>', pin: '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>', cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', clk: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', usr: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>', win: '<circle cx="12" cy="8" r="7"/><path d="M8.2 13.9L7 23l5-3 5 3-1.2-9.1"/>', flt: '<path d="M22 3H2l8 9.5V19l4 2v-8.5z"/>', ok: '<path d="M20 6L9 17l-5-5"/>', home: '<path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>', tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1"/>', lap: '<path d="M3 17V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11M1 20h22"/>', sun: '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>', moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>' };
        const I = (n, s) => `<svg viewBox="0 0 24 24"${s ? ` style="${s}"` : ""}>${P[n]}</svg>`;
        const H = [
            { id: 1, name: "CodeSprint 2026", org: "Rivera Institute of Technology", ab: "CS", mode: "Offline", city: "Mathura", venue: "Main auditorium, Block C", km: 4, date: "2026-11-14", days: 2, time: "9:00 AM Sat – 5:00 PM Sun", fee: 0, elig: "Any college student, all years", ps: "Predefined", psNote: "6 problem statements shared 3 days before", ppt: "Yes – 8 slides, upload by Sun 11:00 AM", team: "2–4", prize: "₹50,000", dl: "2026-11-10", n: 412 },
            { id: 2, name: "GreenHack", org: "Eco Labs Foundation", ab: "GH", mode: "Online", city: "Anywhere", venue: "Discord + Devfolio", km: 0, date: "2026-11-21", days: 2, time: "Starts 6:00 PM Fri, 36 hours", fee: 0, elig: "Students and early professionals, 18+", ps: "Open", psNote: "Choose your own climate-related problem", ppt: "Yes – 5 min demo video plus deck", team: "1–5", prize: "₹1,00,000", dl: "2026-11-19", n: 1280 },
            { id: 3, name: "Agra FinTech Jam", org: "Taj Startup Hub", ab: "FJ", mode: "Offline", city: "Agra", venue: "Startup Hub, Sanjay Place", km: 55, date: "2026-12-05", days: 1, time: "8:00 AM – 8:00 PM", fee: 300, elig: "UG and PG students, ID card needed", ps: "Predefined", psNote: "3 fintech problem statements by sponsors", ppt: "Yes – 10 slides, on-site presentation", team: "3–4", prize: "₹75,000 + internships", dl: "2026-12-01", n: 236 },
            { id: 4, name: "AI for Bharat", org: "Delhi Tech Collective", ab: "AI", mode: "Offline", city: "New Delhi", venue: "Convention hall, Okhla", km: 150, date: "2026-12-12", days: 2, time: "10:00 AM Sat – 6:00 PM Sun", fee: 500, elig: "Open to all, minors need a consent letter", ps: "Open", psNote: "Any AI project that helps local communities", ppt: "Yes – pitch deck and live demo", team: "2–5", prize: "₹2,00,000", dl: "2026-12-08", n: 894 },
            { id: 5, name: "Beginner Build Day", org: "Campus Coders Club", ab: "BB", mode: "Offline", city: "Mathura", venue: "Computer lab 2, Science Block", km: 2, date: "2026-11-08", days: 1, time: "10:00 AM – 4:00 PM", fee: 0, elig: "First and second year students only", ps: "Predefined", psNote: "One theme: build a campus utility app", ppt: "No – show a working demo", team: "1–3", prize: "Certificates + goodies", dl: "2026-11-06", n: 97 },

        const base = ["Government photo ID and college ID", "Laptop, charger and extension board", "Teammates confirmed before registering", "GitHub account with a starter repo ready", "Read the rules and judging criteria", "Tell family or hostel where you’ll be (offline events)"];
        const seed = [{ n: "Aarav S.", p: 6, w: 3 }, { n: "Meera K.", p: 9, w: 2 }, { n: "Rohan D.", p: 4, w: 2 }, { n: "Ishita P.", p: 7, w: 1 }, { n: "Kabir M.", p: 3, w: 0 }];
        let S = { me: "You", friends: [], teams: [], regs: [], bm: [], wins: 0, part: 0, checks: {} };
        try { const x = localStorage.getItem("hacknear"); if (x) S = Object.assign(S, JSON.parse(x)) } catch (e) { }
        const save = () => { try { localStorage.setItem("hacknear", JSON.stringify(S)) } catch (e) { } };
        const $ = s => document.querySelector(s);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
        const left = d => Math.ceil((new Date(d + "T23:59:59") - new Date()) / 864e5);
        const dtxt = n => n < 0 ? "Closed" : n == 0 ? "Last day" : n + " day" + (n > 1 ? "s" : "") + " left";
        function toast(t) { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; e.setAttribute("role", "status"); document.body.append(e); setTimeout(() => e.remove(), 2200) }
        const NAV = [["discover", "Hackathons", "flt"], ["friends", "Friends", "usr"], ["teams", "Teams", "home"], ["board", "Leaderboard", "win"]];
        let F = { q: "", mode: "All", fee: "All", ps: "All", sort: "date" }, dtab = "Details";
        const go = h => { location.hash = h };
        function route() {
            const h = location.hash.slice(1) || "discover";
            $("#nav").innerHTML = NAV.map(([k, t, i]) => `<a role="link" tabindex="0" data-k="${k}" class="${h == k || (k == "discover" && /^h\d+$/.test(h)) ? "on" : ""}">${I(i)}<span>${t}</span></a>`).join("");
            document.querySelectorAll("#nav a").forEach(a => { a.onclick = () => go(a.dataset.k); a.onkeydown = e => { if (e.key == "Enter") go(a.dataset.k) } });
            $("#av").textContent = (S.me[0] || "Y").toUpperCase();
            if (/^h\d+$/.test(h)) Detail(+h.slice(1)); else if (h == "friends") Friends(); else if (h == "teams") Teams(); else if (h == "board") Board(); else Discover(); window.scrollTo(0, 0)
        }
        addEventListener("hashchange", route);
        let TH = null; try { TH = localStorage.getItem("hn-theme") } catch (e) { }
        const isDark = () => TH ? TH == "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
        function theme() { document.documentElement.dataset.theme = isDark() ? "dark" : "light"; const b = $("#tg"); b.innerHTML = I(isDark() ? "sun" : "moon"); b.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode"); b.title = b.getAttribute("aria-label") }
        $("#tg").onclick = () => { TH = isDark() ? "light" : "dark"; try { localStorage.setItem("hn-theme", TH) } catch (e) { } theme() }; theme();
        $("#logo").onclick = () => go("discover"); $("#av").onclick = () => go("board");
        $("#q").oninput = e => { F.q = e.target.value; if ((location.hash.slice(1) || "discover") != "discover") go("discover"); else List() };
        function Discover() {
            $("#main").innerHTML = `<div class="crumb">Home › Hackathons</div><button class="btn o fbtn" id="fb">${I("flt")} Filters</button>
<div class="lay"><aside class="side box" id="side"><h3>${I("flt")} Filters</h3>
${[["Mode", "mode", ["All", "Offline", "Online"]], ["Entry fee", "fee", ["All", "Free", "Paid"]], ["Problem statement", "ps", ["All", "Predefined", "Open"]]].map(([t, k, o]) => `<div class="fg"><b>${t}</b>${o.map(v => `<label><input type="radio" name="${k}" value="${v}" ${F[k] == v ? "checked" : ""}> ${v}</label>`).join("")}</div>`).join("")}
<div class="fg"><b>Sort by</b><select id="sort" aria-label="Sort"><option value="date" ${F.sort == "date" ? "selected" : ""}>Soonest first</option><option value="km" ${F.sort == "km" ? "selected" : ""}>Nearest first</option><option value="n" ${F.sort == "n" ? "selected" : ""}>Most registered</option></select></div></aside>
<section><div class="hd"><h2>Hackathons</h2><span class="mt" id="cnt"></span></div><div id="list"></div></section></div>`;
            $("#fb").onclick = () => $("#side").classList.toggle("show");
            document.querySelectorAll("#side input").forEach(i => i.onchange = () => { F[i.name] = i.value; List() });
            $("#sort").onchange = e => { F.sort = e.target.value; List() }; List()
        }
        function List() {
            const el = $("#list"); if (!el) return;
            const l = H.filter(h => (h.name + h.city + h.org).toLowerCase().includes(F.q.toLowerCase()) && (F.mode == "All" || h.mode == F.mode) && (F.fee == "All" || (F.fee == "Free") == (h.fee == 0)) && (F.ps == "All" || h.ps == F.ps)).sort((a, b) => F.sort == "date" ? a.dl.localeCompare(b.dl) : F.sort == "km" ? a.km - b.km : b.n - a.n);
            $("#cnt").textContent = l.length + " found";
            el.innerHTML = l.map(h => `<article class="hc" data-id="${h.id}" tabindex="0"><div class="ban"><b>${h.ab}</b><small>${h.mode}</small></div>
<div class="mid"><h3>${esc(h.name)}</h3><p class="org">${esc(h.org)}</p>
<span class="chip">${I("pin")}${h.mode == "Offline" ? esc(h.city) + " · " + h.km + " km" : "Online"}</span><span class="chip">${I("cal")}${fmt(h.date)}</span><span class="chip ${h.fee ? "" : "g"}">${I("tag")}${h.fee ? "₹" + h.fee : "Free"}</span><span class="chip">${I("doc")}${h.ps} PS</span><span class="chip">${I("win")}${esc(h.prize)}</span></div>
<div class="rt"><div class="ic"><button class="ib ${S.bm.includes(h.id) ? "on" : ""}" data-bm="${h.id}" aria-label="Bookmark ${esc(h.name)}">${I("bm")}</button><button class="ib" data-sh="${h.id}" aria-label="Share ${esc(h.name)}">${I("sh")}</button></div>
<div><div class="left">${I("clk")}${dtxt(left(h.dl))}</div><div class="reg">${I("usr")}${h.n + (S.regs.some(r => r.id == h.id) ? 1 : 0)} registered</div></div></div></article>`).join("") || '<div class="box mt">No hackathons match. Clear a filter to see more.</div>';
            el.querySelectorAll(".hc").forEach(c => { c.onclick = () => go("h" + c.dataset.id); c.onkeydown = e => { if (e.key == "Enter") go("h" + c.dataset.id) } });
            el.querySelectorAll("[data-bm]").forEach(b => b.onclick = e => { e.stopPropagation(); bm(+b.dataset.bm); List() });
            el.querySelectorAll("[data-sh]").forEach(b => b.onclick = e => { e.stopPropagation(); share(+b.dataset.sh) })
        }
        function bm(id) { const i = S.bm.indexOf(id); i < 0 ? S.bm.push(id) : S.bm.splice(i, 1); save(); toast(i < 0 ? "Bookmarked" : "Bookmark removed") }
        function share(id) { const u = location.href.split("#")[0] + "#h" + id; try { navigator.clipboard.writeText(u).then(() => toast("Link copied"), () => toast(u)) } catch (e) { toast(u) } }
        function Detail(id) {
            const h = H.find(x => x.id == id); if (!h) return go("discover"); const r = S.regs.find(x => x.id == id); const tm = S.teams.filter(t => !t.hid || t.hid == id);
            const T = {
                Details: `<dl class="dl"><dt>${I("pin")}Where</dt><dd>${esc(h.venue)}, ${esc(h.city)}</dd><dt>${I("usr")}Who can join</dt><dd>${esc(h.elig)}</dd><dt>${I("usr")}Team size</dt><dd>${h.team} members</dd><dt>${I("doc")}Problem statement</dt><dd>${h.ps}: ${esc(h.psNote)}</dd><dt>${I("doc")}PPT / demo</dt><dd>${esc(h.ppt)}</dd></dl>`,
                Dates: `<dl class="dl"><dt>${I("clk")}Register by</dt><dd>${fmt(h.dl)} (${dtxt(left(h.dl))})</dd><dt>${I("cal")}Event date</dt><dd>${fmt(h.date)} · ${h.days} day${h.days > 1 ? "s" : ""}</dd><dt>${I("clk")}Timing</dt><dd>${esc(h.time)}</dd></dl>`,
                "Prizes & fee": `<dl class="dl"><dt>${I("win")}Prize pool</dt><dd>${esc(h.prize)}</dd><dt>${I("tag")}Entry fee</dt><dd>${h.fee ? "₹" + h.fee + " per person" : "Free"}</dd></dl>`,
                Checklist: `<div class="chk">${base.map((c, i) => `<label><input type="checkbox" data-c="${id}-${i}" ${S.checks[id + "-" + i] ? "checked" : ""}> ${c}</label>`).join("")}</div>`
            };
            if (!T[dtab]) dtab = "Details";
            $("#main").innerHTML = `<div class="crumb"><a style="cursor:pointer" id="bk">Hackathons</a> › ${esc(h.name)}</div><div class="dg"><div>
<div class="box" style="display:flex;gap:14px;flex-wrap:wrap"><div class="ban"><b>${h.ab}</b><small>${h.mode}</small></div><div class="mid"><h2 style="font-size:22px">${esc(h.name)}</h2><p class="org">${esc(h.org)}</p><span class="chip">${I("pin")}${h.mode == "Offline" ? esc(h.city) : "Online"}</span><span class="chip">${I("cal")}${fmt(h.date)}</span><span class="chip ${h.fee ? "" : "g"}">${I("tag")}${h.fee ? "₹" + h.fee : "Free"}</span></div>
<div class="ic"><button class="ib ${S.bm.includes(id) ? "on" : ""}" id="b1" aria-label="Bookmark">${I("bm")}</button><button class="ib" id="b2" aria-label="Share">${I("sh")}</button></div></div>
<div class="tabs" role="tablist">${Object.keys(T).map(k => `<button role="tab" class="${k == dtab ? "on" : ""}" data-t="${k}">${k}</button>`).join("")}</div><div class="box">${T[dtab]}</div></div>
<aside class="box stick"><p class="mt">Prize pool</p><p class="big">${esc(h.prize)}</p><p class="left">${I("clk")}${dtxt(left(h.dl))} to register</p><p class="reg" style="margin:6px 0 12px">${I("usr")}${h.n + (r ? 1 : 0)} registered</p>
${r ? `<p class="chip g">${I("ok")}Registered as ${esc(r.who)}</p>` : `<div class="f" style="margin:0 0 10px"><select id="tm" aria-label="Register as"><option>Solo</option>${tm.map(t => `<option>${esc(t.name)}</option>`).join("")}</select></div><button class="btn" style="width:100%" id="rg" ${left(h.dl) < 0 ? "disabled" : ""}>Register now</button>`}</aside></div>`;
            $("#bk").onclick = () => go("discover"); $("#b1").onclick = () => { bm(id); Detail(id) }; $("#b2").onclick = () => share(id);
            document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { dtab = b.dataset.t; Detail(id) });
            document.querySelectorAll("[data-c]").forEach(c => c.onchange = () => { S.checks[c.dataset.c] = c.checked; save() });
            const rg = $("#rg"); if (rg) rg.onclick = () => { const w = $("#tm").value; const t = S.teams.find(x => x.name == w); if (t) t.hid = id; S.regs.push({ id, who: w }); S.part++; save(); toast("Registered for " + h.name); Detail(id) }
        }
        function Friends() {
            $("#main").innerHTML = `<div class="crumb">Home › Friends</div><div class="two"><div class="box"><h3>Add online</h3><p class="mt">Add someone by username or email.</p><div class="f"><input id="fu" placeholder="Username or email" aria-label="Username or email"><button class="btn" id="fa">Add friend</button></div></div>
<div class="box"><h3>Add someone nearby</h3><p class="mt">Met a coder at college or an event? Save them here.</p><div class="f"><input id="nn" placeholder="Name" aria-label="Name"><input id="nc" placeholder="College or area" aria-label="College or area"><input id="np" placeholder="Phone or Instagram" aria-label="Contact"><button class="btn" id="na">Save</button></div></div></div>
<div class="box"><h3>Your friends (${S.friends.length})</h3>${S.friends.map((f, i) => `<div class="row"><div><b>${esc(f.n)}</b><div class="mt">${f.t == "online" ? "Online friend" : "Nearby · " + esc(f.c || "no area added") + (f.p ? " · " + esc(f.p) : "")}</div></div><button class="btn o sm" data-rm="${i}">Remove</button></div>`).join("") || '<p class="mt">No friends yet. Add someone above to start building a team.</p>'}</div>`;
            $("#fa").onclick = () => { const v = $("#fu").value.trim(); if (!v) return toast("Enter a username or email"); S.friends.push({ n: v, t: "online" }); save(); toast("Request sent to " + v); Friends() };
            $("#na").onclick = () => { const n = $("#nn").value.trim(); if (!n) return toast("Enter a name"); S.friends.push({ n, t: "near", c: $("#nc").value.trim(), p: $("#np").value.trim() }); save(); toast(n + " added"); Friends() };
            document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { S.friends.splice(+b.dataset.rm, 1); save(); Friends() })
        }
        function Teams() {
            $("#main").innerHTML = `<div class="crumb">Home › Teams</div><div class="box" style="margin-bottom:12px"><h3>Create a team</h3><div class="f"><input id="tn" placeholder="Team name" aria-label="Team name"><select id="th" aria-label="Hackathon"><option value="">Choose hackathon later</option>${H.map(h => `<option value="${h.id}">${esc(h.name)}</option>`).join("")}</select><button class="btn" id="tc">Create team</button></div></div>
${S.teams.map((t, i) => { const h = H.find(x => x.id == t.hid), av = S.friends.filter(f => !t.m.includes(f.n)); return `<div class="box" style="margin-bottom:12px"><div class="hd"><div><h3>${esc(t.name)}</h3><p class="mt">${h ? esc(h.name) + " · team size " + h.team : "No hackathon chosen yet"}</p></div><button class="btn o sm" data-del="${i}">Delete</button></div><p><b>Members:</b> ${[S.me].concat(t.m).map(esc).join(", ")}</p>${av.length ? `<div class="f"><select id="s${i}" aria-label="Add a friend">${av.map(f => `<option>${esc(f.n)}</option>`).join("")}</select><button class="btn sm" data-add="${i}">Add to team</button></div>` : '<p class="mt">Add friends first to invite them.</p>'}</div>` }).join("") || '<div class="box mt">No teams yet. Create one above, then add friends.</div>'}`;
            $("#tc").onclick = () => { const n = $("#tn").value.trim(); if (!n) return toast("Give your team a name"); S.teams.push({ name: n, hid: +$("#th").value || null, m: [] }); save(); toast("Team created"); Teams() };
            document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const i = +b.dataset.add; S.teams[i].m.push($("#s" + i).value); save(); Teams() });
            document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.teams.splice(+b.dataset.del, 1); save(); Teams() })
        }
        function Board() {
            const all = seed.concat([{ n: S.me, p: S.part, w: S.wins, me: 1 }]).sort((a, b) => b.w - a.w || b.p - a.p);
            $("#main").innerHTML = `<div class="crumb">Home › Leaderboard</div><div class="two"><div class="box"><h3>My profile</h3><p class="mt">Registered: ${S.part} · Won: ${S.wins} · Bookmarked: ${S.bm.length}</p><div class="f"><input id="ln" value="${esc(S.me)}" aria-label="Your name"><button class="btn o" id="lr">Save name</button><button class="btn" id="lw">Log a win</button></div></div>
<div class="box"><h3>My registrations</h3>${S.regs.map(r => { const h = H.find(x => x.id == r.id); return `<div class="row"><span>${esc(h.name)}</span><span class="mt">${esc(r.who)}</span></div>` }).join("") || '<p class="mt">Nothing yet. Register for a hackathon to see it here.</p>'}</div></div>
<div class="box"><h3>Leaderboard</h3><div style="overflow-x:auto"><table><tr><th>Rank</th><th>Name</th><th>Hackathons</th><th>Wins</th></tr>${all.map((r, i) => `<tr class="${r.me ? "me" : ""}"><td>${i + 1}</td><td>${esc(r.n)}</td><td>${r.p}</td><td>${r.w}</td></tr>`).join("")}</table></div></div>`;
            $("#lw").onclick = () => { if (S.wins >= S.part) S.part++; S.wins++; save(); toast("Win logged"); Board() };
            $("#lr").onclick = () => { S.me = $("#ln").value.trim() || "You"; save(); route() }
        }
        route();
    </script>
</body>

</html>
